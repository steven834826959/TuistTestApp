name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.0"

      - name: Install Tuist
        run: |
          set -euo pipefail
          if ! command -v tuist >/dev/null 2>&1; then
            export HOMEBREW_NO_AUTO_UPDATE=1
            brew install tuist || brew upgrade tuist
          fi
          tuist version

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Tuist install
        working-directory: MyApp
        run: |
          echo "Installing Tuist dependencies..."
          tuist install --verbose || {
            echo "tuist install failed, checking error..."
            exit 1
          }
          echo "Verifying dependencies were installed..."
          if [ ! -f "Tuist/Package.resolved" ]; then
            echo "Error: Package.resolved not found after tuist install"
            exit 1
          fi
          echo "Dependencies installed successfully"

      - name: Generate Xcode workspace
        working-directory: MyApp
        run: tuist generate --no-open

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build
        working-directory: MyApp
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MyApp.xcworkspace \
            -scheme MyApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            clean build | xcpretty

      - name: Test
        working-directory: MyApp
        run: |
          set -o pipefail
          xcodebuild \
            -workspace MyApp.xcworkspace \
            -scheme MyApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            test | xcpretty

